name: publish

# Publishes to npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC): no npm token is stored in this repository.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@11
      - name: Check that the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "Tag $TAG does not match package.json $PKG"; exit 1; fi
      - name: Self test
        run: npm test
      - name: Publish
        run: npm publish --provenance --access public
